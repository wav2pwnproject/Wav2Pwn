<svg width="1280" height="360" viewBox="0 0 1280 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Wav2Pwn transfer signature map</title>
  <desc id="desc">A light academic-style overview of Wav2Pwn showing probing, response signatures, surrogate family selection, and adversarial transfer.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFDF8"/>
      <stop offset="0.52" stop-color="#F8FBF7"/>
      <stop offset="1" stop-color="#FFF7F2"/>
    </linearGradient>
    <linearGradient id="accent" x1="74" y1="58" x2="598" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7A3415"/>
      <stop offset="0.52" stop-color="#0F766E"/>
      <stop offset="1" stop-color="#4C1D95"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#42302A" flood-opacity="0.11"/>
    </filter>
  </defs>

  <rect width="1280" height="360" rx="24" fill="url(#page)"/>
  <path d="M62 54H1218" stroke="#E7DDD1" stroke-width="1"/>
  <path d="M62 306H1218" stroke="#E7DDD1" stroke-width="1"/>
  <path d="M670 54V306" stroke="#E7DDD1" stroke-width="1"/>

  <text x="74" y="86" fill="url(#accent)" font-family="Georgia, Times New Roman, serif" font-size="58" font-weight="700">Wav2Pwn</text>
  <text x="78" y="126" fill="#312E2A" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="720">Transferability-guided surrogate selection</text>
  <text x="78" y="156" fill="#6B5F57" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="520">Black-box SSL-ASR attacks via behavioral response signatures.</text>

  <g transform="translate(78 188)" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect x="0" y="0" width="118" height="30" rx="6" fill="#FDECC8" stroke="#E9B45D"/>
    <text x="16" y="20" fill="#7A3415" font-size="12" font-weight="820" letter-spacing="0.8">AISTATS 2027</text>
    <rect x="130" y="0" width="144" height="30" rx="6" fill="#DDF3EE" stroke="#8CCFC2"/>
    <text x="148" y="20" fill="#0F766E" font-size="12" font-weight="820" letter-spacing="0.8">SSL-ASR FAMILY</text>
    <rect x="286" y="0" width="118" height="30" rx="6" fill="#EEE7FF" stroke="#C8B6F5"/>
    <text x="304" y="20" fill="#4C1D95" font-size="12" font-weight="820" letter-spacing="0.8">BLACK BOX</text>
    <rect x="416" y="0" width="116" height="30" rx="6" fill="#F4E7DC" stroke="#D7B99F"/>
    <text x="435" y="20" fill="#61422E" font-size="12" font-weight="820" letter-spacing="0.8">ARTIFACT</text>
  </g>

  <g transform="translate(78 248)" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" filter="url(#soft)">
    <rect x="0" y="0" width="150" height="46" rx="10" fill="#FFFFFF" stroke="#E5D6C7"/>
    <text x="18" y="20" fill="#312E2A" font-size="13" font-weight="820">Probe</text>
    <text x="18" y="35" fill="#7A706A" font-size="11" font-weight="550">target responses</text>
    <rect x="202" y="0" width="166" height="46" rx="10" fill="#FFFFFF" stroke="#E5D6C7"/>
    <text x="220" y="20" fill="#312E2A" font-size="13" font-weight="820">Fingerprint</text>
    <text x="220" y="35" fill="#7A706A" font-size="11" font-weight="550">family behavior</text>
    <rect x="420" y="0" width="170" height="46" rx="10" fill="#FFFFFF" stroke="#E5D6C7"/>
    <text x="438" y="20" fill="#312E2A" font-size="13" font-weight="820">Transfer</text>
    <text x="438" y="35" fill="#7A706A" font-size="11" font-weight="550">selected surrogate</text>
    <path d="M158 23H192" stroke="#A16207" stroke-width="2"/>
    <path d="M184 15L194 23L184 31" stroke="#A16207" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M376 23H410" stroke="#0F766E" stroke-width="2"/>
    <path d="M402 15L412 23L402 31" stroke="#0F766E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(720 70)" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="0" y="0" fill="#312E2A" font-size="16" font-weight="820">Response Signature Space</text>
    <text x="0" y="24" fill="#7A706A" font-size="13" font-weight="540">Each color band represents a surrogate family cluster.</text>

    <g transform="translate(0 48)" filter="url(#soft)">
      <rect x="0" y="0" width="438" height="198" rx="18" fill="#FFFFFF" stroke="#E7DDD1"/>
      <g transform="translate(26 28)">
        <rect x="0" y="0" width="44" height="28" rx="6" fill="#FDE68A"/>
        <rect x="52" y="0" width="44" height="28" rx="6" fill="#FCD34D"/>
        <rect x="104" y="0" width="44" height="28" rx="6" fill="#FDE68A"/>
        <rect x="156" y="0" width="44" height="28" rx="6" fill="#F5D0FE"/>
        <rect x="208" y="0" width="44" height="28" rx="6" fill="#CCFBF1"/>
        <rect x="260" y="0" width="44" height="28" rx="6" fill="#99F6E4"/>
        <rect x="312" y="0" width="44" height="28" rx="6" fill="#E9D5FF"/>
        <rect x="364" y="0" width="22" height="28" rx="6" fill="#DDD6FE"/>

        <rect x="0" y="38" width="44" height="28" rx="6" fill="#FEF3C7"/>
        <rect x="52" y="38" width="44" height="28" rx="6" fill="#F59E0B"/>
        <rect x="104" y="38" width="44" height="28" rx="6" fill="#FCD34D"/>
        <rect x="156" y="38" width="44" height="28" rx="6" fill="#FAE8FF"/>
        <rect x="208" y="38" width="44" height="28" rx="6" fill="#CCFBF1"/>
        <rect x="260" y="38" width="44" height="28" rx="6" fill="#5EEAD4"/>
        <rect x="312" y="38" width="44" height="28" rx="6" fill="#F3E8FF"/>
        <rect x="364" y="38" width="22" height="28" rx="6" fill="#E9D5FF"/>

        <rect x="0" y="76" width="44" height="28" rx="6" fill="#F3E8FF"/>
        <rect x="52" y="76" width="44" height="28" rx="6" fill="#E9D5FF"/>
        <rect x="104" y="76" width="44" height="28" rx="6" fill="#DDD6FE"/>
        <rect x="156" y="76" width="44" height="28" rx="6" fill="#8B5CF6"/>
        <rect x="208" y="76" width="44" height="28" rx="6" fill="#C4B5FD"/>
        <rect x="260" y="76" width="44" height="28" rx="6" fill="#FDE68A"/>
        <rect x="312" y="76" width="44" height="28" rx="6" fill="#F3E8FF"/>
        <rect x="364" y="76" width="22" height="28" rx="6" fill="#DDD6FE"/>

        <rect x="0" y="114" width="44" height="28" rx="6" fill="#CCFBF1"/>
        <rect x="52" y="114" width="44" height="28" rx="6" fill="#99F6E4"/>
        <rect x="104" y="114" width="44" height="28" rx="6" fill="#FDE68A"/>
        <rect x="156" y="114" width="44" height="28" rx="6" fill="#E9D5FF"/>
        <rect x="208" y="114" width="44" height="28" rx="6" fill="#14B8A6"/>
        <rect x="260" y="114" width="44" height="28" rx="6" fill="#5EEAD4"/>
        <rect x="312" y="114" width="44" height="28" rx="6" fill="#CCFBF1"/>
        <rect x="364" y="114" width="22" height="28" rx="6" fill="#99F6E4"/>
      </g>
    </g>

    <g transform="translate(26 274)">
      <circle cx="10" cy="10" r="8" fill="#F59E0B"/>
      <text x="26" y="14" fill="#7A706A" font-size="12" font-weight="650">Wav2Vec2-like</text>
      <circle cx="142" cy="10" r="8" fill="#8B5CF6"/>
      <text x="158" y="14" fill="#7A706A" font-size="12" font-weight="650">HuBERT-like</text>
      <circle cx="260" cy="10" r="8" fill="#14B8A6"/>
      <text x="276" y="14" fill="#7A706A" font-size="12" font-weight="650">WavLM-like</text>
    </g>
  </g>
</svg>
