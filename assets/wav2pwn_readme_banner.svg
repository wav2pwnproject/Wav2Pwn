<svg width="1280" height="340" viewBox="0 0 1280 340" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Wav2Pwn research artifact banner</title>
  <desc id="desc">A dark conference-style banner for Wav2Pwn showing speech waves, surrogate model selection, and black-box ASR transfer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#08111F"/>
      <stop offset="0.48" stop-color="#0E1A2E"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="360" y1="100" x2="900" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#25D0E8"/>
      <stop offset="0.44" stop-color="#58A6FF"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="170" y1="250" x2="1110" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#26D9D0"/>
      <stop offset="0.45" stop-color="#4DA3FF"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.2 0 0 0 0 0.65 0 0 0 0 1 0 0 0 0.45 0"/>
      <feBlend in="SourceGraphic" mode="screen"/>
    </filter>
  </defs>

  <rect x="1.5" y="1.5" width="1277" height="337" rx="28" fill="url(#bg)" stroke="#31435F" stroke-width="3"/>
  <circle cx="180" cy="255" r="120" fill="#103F46" opacity="0.78"/>
  <circle cx="1090" cy="70" r="110" fill="#1B2A6B" opacity="0.65"/>
  <circle cx="1030" cy="270" r="58" fill="#18243A" opacity="0.85"/>

  <g opacity="0.34">
    <path d="M72 76H252" stroke="#24364E" stroke-width="2"/>
    <path d="M1020 218H1200" stroke="#263852" stroke-width="2"/>
    <path d="M926 54H1164" stroke="#263852" stroke-width="2"/>
    <path d="M100 294H340" stroke="#24364E" stroke-width="2"/>
  </g>

  <g transform="translate(118 88)">
    <path d="M116 38H50C39 38 30 47 30 58V210H80V142H121C153 142 178 119 178 90C178 60 151 38 116 38ZM80 80H116C124 80 130 85 130 92C130 99 124 104 116 104H80V80Z" fill="#27D3E7"/>
    <path d="M178 70L130 42V96H178V70Z" fill="#4AA3FF"/>
    <rect x="103" y="120" width="68" height="48" fill="#E6EDF6"/>
    <path d="M19 210C62 163 101 163 144 210" stroke="#1FC7C8" stroke-width="9" stroke-linecap="round"/>
    <path d="M19 210C62 172 101 172 144 210" stroke="#63E6E2" stroke-width="4" stroke-linecap="round" opacity="0.55"/>
  </g>

  <text x="360" y="118" fill="url(#titleGrad)" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="62" font-weight="800" letter-spacing="0">Wav2Pwn</text>
  <text x="362" y="164" fill="#D8E2F1" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="27" font-weight="650" letter-spacing="0">Transferability-guided surrogate selection for black-box ASR attacks</text>
  <text x="362" y="204" fill="#94A3B8" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="21" font-weight="500" letter-spacing="0">SSL-ASR family signatures · low-query probing · targeted and untargeted transfer</text>

  <g transform="translate(362 232)" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="800" letter-spacing="1.4">
    <rect x="0" y="0" width="112" height="34" rx="4" fill="#3B3F46"/>
    <text x="18" y="22" fill="#F8FAFC">PAPER</text>
    <rect x="120" y="0" width="170" height="34" rx="4" fill="#2563EB"/>
    <text x="139" y="22" fill="#FFFFFF">AISTATS 2027</text>
    <rect x="298" y="0" width="96" height="34" rx="4" fill="#7C3AED"/>
    <text x="316" y="22" fill="#FFFFFF">PYTHON</text>
    <rect x="402" y="0" width="118" height="34" rx="4" fill="#0284C7"/>
    <text x="421" y="22" fill="#FFFFFF">SSL-ASR</text>
    <rect x="528" y="0" width="138" height="34" rx="4" fill="#0F766E"/>
    <text x="546" y="22" fill="#FFFFFF">BLACK BOX</text>
    <rect x="674" y="0" width="128" height="34" rx="4" fill="#475569"/>
    <text x="692" y="22" fill="#FFFFFF">ARTIFACT</text>
  </g>

  <path d="M178 270C232 200 286 200 340 270C394 340 448 340 502 270C556 200 610 200 664 270C718 340 772 340 826 270C880 200 934 200 988 270C1042 340 1096 340 1150 270" stroke="#102338" stroke-width="14" stroke-linecap="round" opacity="0.75"/>
  <path d="M178 270C232 200 286 200 340 270C394 340 448 340 502 270C556 200 610 200 664 270C718 340 772 340 826 270C880 200 934 200 988 270C1042 340 1096 340 1150 270" stroke="url(#waveGrad)" stroke-width="8" stroke-linecap="round" filter="url(#softGlow)"/>

  <g transform="translate(930 116)">
    <rect x="0" y="0" width="204" height="72" rx="12" fill="#111C2E" stroke="#31435F"/>
    <text x="20" y="30" fill="#D8E2F1" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" font-weight="700">Target ASR</text>
    <text x="20" y="54" fill="#8EA1BC" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="500">behavior signature</text>
    <path d="M-128 36H-18" stroke="#4DA3FF" stroke-width="3" stroke-dasharray="8 8"/>
    <path d="M-28 24L-6 36L-28 48" stroke="#4DA3FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
