<svg width="1280" height="360" viewBox="0 0 1280 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Wav2Pwn surrogate selection overview</title>
  <desc id="desc">A clean research banner showing Wav2Pwn as a probing-guided surrogate selection method with SSL-ASR family signatures and a transfer matrix.</desc>
  <defs>
    <linearGradient id="paperBg" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F8FBFF"/>
      <stop offset="0.55" stop-color="#F3F7FE"/>
      <stop offset="1" stop-color="#F7F3FF"/>
    </linearGradient>
    <linearGradient id="ink" x1="100" y1="42" x2="610" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#102A43"/>
      <stop offset="0.62" stop-color="#1D4ED8"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="matrixHot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E0F2FE"/>
      <stop offset="0.5" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="panelShadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#12355B" flood-opacity="0.14"/>
