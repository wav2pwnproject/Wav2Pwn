  <text x="86" y="115" fill="#334155" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="23" font-weight="650" letter-spacing="0">Probing-guided surrogate selection for black-box SSL-ASR attacks</text>
  <text x="86" y="148" fill="#64748B" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" font-weight="500" letter-spacing="0">Behavioral fingerprints reveal model-family transfer structure before attack time.</text>

